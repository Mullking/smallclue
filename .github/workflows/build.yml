name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake cmake pkg-config \
            libssl-dev zlib1g-dev libcurl4-openssl-dev libbsd-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake cmake pkg-config openssl@3

      - name: Fetch dependencies
        run: ./fetch_dependencies.sh

      # No OpenSSH configure step: CMakeLists.txt runs openssh's ./configure
      # itself on Linux, and on macOS builds against the fork's committed
      # config.h, which configuring here would overwrite. Either way CI takes
      # the same path a fresh developer clone does.
      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Smoke test
        run: |
          ./build/smallclue rsync --version
          ./build/smallclue ls --help || true
